<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{shop_name}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #fdfdfd; }
        .hero-bg { 
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('{{hero_image}}');
            background-size: cover;
            background-position: center;
        }
        .product-card img { transition: transform 0.4s ease; }
        .product-card:hover img { transform: scale(1.08); }
        .btn-primary { @apply bg-indigo-600 text-white font-semibold py-3 px-8 rounded-full transition-all duration-300 ease-in-out; }
        .btn-primary:hover { @apply bg-indigo-700 shadow-lg transform -translate-y-1; }
    </style>
</head>
<body class="text-gray-700">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-gray-900">
                <i class="fas fa-gem mr-2 text-indigo-600"></i>{{shop_name}}
            </a>
            <div class="hidden md:flex space-x-8 items-center">
                <a href="#home" class="text-gray-600 hover:text-indigo-600 transition font-medium">Home</a>
                <a href="#products" class="text-gray-600 hover:text-indigo-600 transition font-medium">Products</a>
                <a href="#about" class="text-gray-600 hover:text-indigo-600 transition font-medium">About</a>
                <a href="#contact" class="text-gray-600 hover:text-indigo-600 transition font-medium">Contact</a>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero-bg text-white min-h-[70vh] flex items-center justify-center">
        <div class="text-center bg-black bg-opacity-30 p-12 rounded-lg">
            <h1 class="text-4xl md:text-6xl font-bold mb-4">Discover Your Signature Style</h1>
            <p class="text-lg md:text-xl mb-8">{{about_text}}</p>
            <a href="#products" class="btn-primary">Shop Now</a>
        </div>
    </section>

    <!-- Products Section -->
    <section id="products" class="py-24 bg-[#f7f7f7]">
        <div class="container mx-auto px-6">
            <div class="text-center mb-16">
                <h2 class="text-4xl font-bold text-gray-800">Featured Products</h2>
            </div>
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10">
                {{product_cards}}
            </div>
        </div>
    </section>

    <!-- About Section -->
    <section id="about" class="py-24 bg-white">
        <div class="container mx-auto px-6 flex flex-col md:flex-row items-center gap-16">
            <div class="md:w-1/2">
                <img src="{{about_image}}" alt="About Us" class="rounded-lg shadow-xl">
            </div>
            <div class="md:w-1/2 text-center md:text-left">
                <h2 class="text-4xl font-bold text-gray-800 mb-6">About {{shop_name}}</h2>
                <p class="text-gray-600 leading-relaxed mb-4">{{about_text}}</p>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="py-24 bg-[#f7f7f7]">
        <div class="container mx-auto px-6 text-center">
            <h2 class="text-4xl font-bold text-gray-800 mb-6">Get In Touch</h2>
            <p class="text-gray-500 mb-6">Email: {{contact_email}}</p>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-12 text-center">
        <p class="text-gray-500">&copy; 2024 {{shop_name}}. All Rights Reserved.</p>
    </footer>

</body>
</html>
